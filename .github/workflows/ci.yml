name: CI

on:
  push:
    # `develop` é a branch de trabalho que o ambiente `hom` da Railway segue;
    # `main` é a que `prod` segue. Sem `develop` aqui, o push que dispara o
    # deploy de `hom` chegaria lá sem nenhum teste ter rodado — e o "Wait for
    # CI" da Railway não teria check nenhum para esperar.
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint (inclui a trava contra Pool/db fora de src/db e src/contexto — RN-054t)
        run: pnpm run lint

      - name: Aplica migrations no schema de CI
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          DB_SCHEMA_ESPERADO: ${{ vars.DB_SCHEMA_ESPERADO || 'dev' }}

      # Isolado e primeiro: é o teste mais barato e o que protege a
      # fronteira de verdade (RN-141) — se cair, nem vale a pena rodar o
      # resto.
      - name: RN-141 — cobertura de RLS
        run: pnpm run test:rls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          DB_SCHEMA_ESPERADO: ${{ vars.DB_SCHEMA_ESPERADO || 'dev' }}

      # Drift check: se alguém mudou uma migration sem rodar `db:pull`
      # depois, o schema.ts commitado diverge do banco de verdade e o CI
      # falha aqui, antes do resto rodar contra tipos desatualizados.
      #
      # Roda contra o schema "dev" (não "ci"): é dali que o schema.ts
      # commitado foi gerado, então é a única base de comparação válida.
      # É introspecção pura (db:pull não escreve no banco), por isso não
      # fere o isolamento que motivou mover as outras etapas pra "ci".
      #
      # O `drizzle-kit pull` troca as cláusulas `using`/`withCheck` entre
      # policies de mesmo nome quando uma tabela tem mais de uma — bug de
      # geração do TypeScript, não divergência real: conferido direto em
      # `pg_policies`, o banco está correto. Isso deixava a etapa vermelha de
      # forma intermitente e, com "Wait for CI" ligado, bloqueava o deploy de
      # `hom` sem nenhuma divergência de verdade.
      #
      # Por isso o diff é filtrado em vez de comparado inteiro: as linhas com
      # `pgPolicy(` saem, qualquer outra ainda reprova. Medido em 06/09/2026
      # num schema sem mudança nenhuma de estrutura: 34 linhas alteradas, todas
      # com `pgPolicy(` — o filtro cobre o ruído sem abrir mão da trava.
      - name: Confere que src/db/schema.ts está sincronizado com as migrations
        run: |
          pnpm run db:pull
          restante=$(git diff -U0 -- src/db/schema.ts src/db/relations.ts \
            | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -v 'pgPolicy(' || true)
          if [ -n "$restante" ]; then
            echo "Drift real entre as migrations e src/db/schema.ts:"
            echo "$restante"
            echo "Rode 'pnpm db:pull' e commite o resultado."
            exit 1
          fi
          echo "Sem drift real (ignoradas as trocas de pgPolicy do drizzle-kit)."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DB_SCHEMA_ESPERADO: dev

      - name: Suíte de integração completa (RLS, contexto de transação, isolamento entre inquilinos)
        run: pnpm run test:integracao
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          DB_SCHEMA_ESPERADO: ${{ vars.DB_SCHEMA_ESPERADO || 'dev' }}
